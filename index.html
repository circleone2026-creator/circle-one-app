<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle One - Gadani Business Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:system-ui, -apple-system, sans-serif}</style>
</head>
<body class="bg-[#f8f9fc]">
<!-- Header -->
<header class="bg-white shadow-sm p-4 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">C1</div><span class="font-bold text-xl">Circle One</span></div>
<button class="bg-blue-600 text-white px-4 py-2 rounded-full">Join Now</button>
</header>

<!-- Hero -->
<section class="px-6 py-12 text-center">
<h1 class="text-4xl font-extrabold leading-tight">گڈانی کا سب سے بڑا<br><span class="text-blue-600">بزنس سرکل</span></h1>
<p class="mt-4 text-gray-600">تاجر، دکاندار، اور ہنر مند سب ایک جگہ۔ اپنا کاروبار بڑھائیں۔</p>
<div class="mt-8 flex justify-center gap-3">
<button class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold">ایپ جوائن کریں</button>
<button class="bg-white border px-8 py-3 rounded-full font-bold">دیکھیں کیسے کام کرتا ہے</button>
</div>
</section>

<!-- Features -->
<div class="grid grid-cols-2 gap-4 px-6">
<div class="bg-white p-5 rounded-2xl shadow-sm"><div class="text-2xl">🛒</div><h3 class="font-bold mt-2">مارکیٹ پلیس</h3><p class="text-sm text-gray-500 mt-1">اپنی پروڈکٹ بیچیں</p></div>
<div class="bg-white p-5 rounded-2xl shadow-sm"><div class="text-2xl">🤝</div><h3 class="font-bold mt-2">نیٹ ورکنگ</h3><p class="text-sm text-gray-500 mt-1">نئے لوگوں سے جڑیں</p></div>
<div class="bg-white p-5 rounded-2xl shadow-sm"><div class="text-2xl">📢</div><h3 class="font-bold mt-2">اشتہار</h3><p class="text-sm text-gray-500 mt-1">اپنے بزنس کا پرچار</p></div>
<div class="bg-white p-5 rounded-2xl shadow-sm"><div class="text-2xl">💼</div><h3 class="font-bold mt-2">نوکریاں</h3><p class="text-sm text-gray-500 mt-1">کام ڈھونڈیں یا دیں</p></div>
</div>

<footer class="text-center py-10 text-gray-400 text-sm">© 2026 Circle One - Made in Gadani</footer>
</body>
</html>
